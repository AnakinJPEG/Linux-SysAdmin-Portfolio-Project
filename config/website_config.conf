

server {
        listen 80;
        listen [::]:80;
        server_name lab-web-01 172.238.229.134;
        return 301 https://$host$request_uri;
}

server {
        listen 443 ssl;
        server_name lab-web-01 172.238.229.134;

        ssl_certificate /etc/nginx/ssl/example.cert
        ssl_certificate_key /etc/nginx/ssl/example.key
        ssl_protocols TLSv1.2 TLSv1.3
        ssl_ciphers HIGH:!aNULL:!MD5

        root /var/www/lab-web-01/html;
        index index.html;

        # Logging with a custom format
        access_log /var/log/nginx/lab-web-01.access.log;
        error_log /var/log/nginx/lab-web-01.error.log;

         limit_req zone=labweb burst=5 nodelay;

         location / {
                 try_files $uri $uri/ =404;
        }

        # Deny access to hidden files
        location ~ /\. {
                deny all;
        }
}

